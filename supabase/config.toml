# Pins the local Supabase stack the acceptance run brings up with the CLI.
# Tests run against this stack in Docker, never against a hosted project.
# Its own project_id and port block keep it apart from the meals stack, which
# runs on this machine on the default ports (54321-54327).

project_id = "abbaas-ledger"

[api]
enabled = true
port = 54421
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = true
port = 54424

[storage]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:4317"
additional_redirect_urls = ["http://127.0.0.1:4317", "http://localhost:4317"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = false
# Email and password only, and no mail round trip: the acceptance run creates
# its accounts through the service role with addresses already confirmed.
enable_confirmations = false
secure_password_change = false
