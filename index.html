<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Abbaas Ledger</title>
    <!-- What Chrome needs to add this to the Android home screen: the manifest
         that names the app and its icons, the colour the system paints around
         it, and the icon iOS reads instead. Every path goes through %BASE_URL%,
         so the same build installs from the GitHub Pages sub-path. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#f4f7f6" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <!-- Manrope for titles and numbers, Source Sans 3 for body text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
